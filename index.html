<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOR77 - SITUS GACOR TERPERCAYA</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: sans-serif; color: #fff; overflow: hidden; }
        .wrapper {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            text-align: center;
        }
        .logo { font-size: 3.5rem; font-weight: 900; letter-spacing: 5px; margin-bottom: 10px; }
        .gold { color: #ffaa00; text-shadow: 0 0 15px #ffaa00; }
        .tagline { font-size: 1rem; color: #00f2ff; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 40px; text-shadow: 0 0 5px #00f2ff; }
        .btn {
            background: linear-gradient(45deg, #ffaa00, #ffea00);
            color: #000; padding: 20px 50px; text-decoration: none; font-weight: bold;
            border-radius: 50px; font-size: 1.5rem; box-shadow: 0 0 20px #ffaa00;
            text-transform: uppercase; animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="logo"><span class="gold">SOR</span>777</div>
        <p class="tagline">Situs Resmi Terpercaya & Gacor</p>
        <a href="https://sorkaleah.short.gy/sorkale" class="btn">MASUK SEKARANG</a>
    </div>
</body>
</html>
